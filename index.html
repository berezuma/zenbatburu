<style>
/* ===========================================================================
   «ERAZTUNA»

   Orri honen protagonista zirkulu bat da: urtea. Animalia bakoitza puntu bat
   da, eta bere lekua jaiotze-eguna da — ez metafora bat, iturriko eremu bat
   (`JAIOTZA-DATA`). Eraztunak zerbait erakusten du taula batek ezkutatzen
   duena: espezie bakoitzak urtean forma bat duela.

   KOLOREA. Bost espeziek bost tonu dituzte, eta tonu horiek ez dira beste
   ezertarako erabiltzen orri osoan. Hori da diziplina: kolorea espeziea da,
   beti, eta azpimarratzeko gainerakoa ilundu egiten da, ez da kolore berri
   bat sartzen. Arrazen egoera ofiziala ez da kolorez adierazten — testuz,
   iturriak hala dakarrelako.

   TIPOGRAFIA. Instrument Serif izenburuetan: pisu bakarra, didone bat, plaka
   grabatu baten antzekoa. Spectral irakurketan eta zifretan, zifra tabularrak
   dituelako — diru- eta kopuru-zutabeak lerrokatuta behar dute.

   PAPERA. Hondoa argia da, erregistro-liburu batena. Aurreko lan batean gaua
   zen; hau egunez idatzitako liburu bat da.
=========================================================================== */
:root{
  color-scheme: light;

  --paper:   #f3efe6;   /* orriaren papera */
  --paper-2: #eae4d7;   /* atal txandakatuak */
  --ink:     #1d1a14;   /* testua eta egitura */
  --ink-70:  #55503f;
  --ink-45:  #87806a;
  --ink-20:  #cfc7b4;
  --ink-10:  #e2dbc9;

  /* Espezie bakoitzak bere tonua. Ez dira beste ezertarako. */
  --behi:    #b4552f;
  --ardi:    #3f6b63;
  --ahuntz:  #9a7b22;
  --zaldi:   #4a4f8c;
  --asto:    #7b5570;

  --flag:    #a8341f;   /* abisuak eta oharrak bakarrik */

  --wrap: 68rem;
  --text: 36rem;

  --disp: "Instrument Serif", Georgia, "Times New Roman", serif;
  --body: "Spectral", Georgia, "Times New Roman", serif;
}

*,*::before,*::after{ box-sizing:border-box }
html{ -webkit-text-size-adjust:100% }
body{
  margin:0; background:var(--paper); color:var(--ink);
  font:400 1.0625rem/1.68 var(--body);
  font-variant-numeric: tabular-nums lining-nums;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
img,canvas,svg{ display:block; max-width:100% }
button{ font:inherit; color:inherit }
a{ color:inherit; text-decoration-thickness:.06em; text-underline-offset:.18em }

.wrap{ width:100%; max-width:var(--wrap); margin-inline:auto; padding-inline:1rem }
@media (min-width:48rem){ .wrap{ padding-inline:2rem } }

.skip{
  position:absolute; width:1px; height:1px; margin:-1px; padding:0;
  overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0;
}
a.skip:focus{
  position:fixed; inset-inline-start:1rem; inset-block-start:1rem;
  width:auto; height:auto; clip:auto; margin:0; padding:.6rem .9rem;
  background:var(--ink); color:var(--paper); z-index:60;
}
:focus-visible{ outline:2px solid var(--ink); outline-offset:3px }

.disp{ font-family:var(--disp); font-weight:400; letter-spacing:.005em }
.sci{ font-style:italic }

/* --------------------------------------------------------------- JS gabe */
.nojs{ max-width:var(--text); margin:0 auto; padding:3rem 1.25rem }
.nojs p{ margin:0 0 1rem }

/* ---------------------------------------------------------------- goiburua */
.hero{
  position:relative; min-height:100svh; display:flex; flex-direction:column;
  overflow:clip; border-bottom:1px solid var(--ink-20);
}
.hero canvas{
  position:absolute; inset:0; width:100%; height:100%; z-index:0;
  opacity:.52;   /* testua irakurgarri; eraztuna hondoa da, ez protagonista */
}
.hero-inner{
  position:relative; z-index:1; flex:1 1 auto; display:flex;
  flex-direction:column; width:100%; max-width:var(--wrap);
  margin-inline:auto; padding:1.1rem 1rem 1.6rem;
}
@media (min-width:48rem){ .hero-inner{ padding:1.4rem 2rem 2rem } }

.hero-bar{
  display:flex; align-items:center; justify-content:space-between; gap:1rem;
}
.brand{
  font:400 .8125rem/1 var(--body); letter-spacing:.14em; text-transform:uppercase;
  color:var(--ink-70);
}
.hero-mid{ flex:1 1 auto; display:flex; flex-direction:column; justify-content:center;
  padding-block:2.5rem 1rem }
.hero-mid h1{
  font-family:var(--disp); font-weight:400; margin:.1em 0 .35em;
  font-size:clamp(2.6rem, 11vw, 6.6rem); line-height:.95; letter-spacing:-.012em;
  max-width:22ch;
}
.figure{
  font-family:var(--disp); font-size:clamp(1.3rem,4.2vw,2rem); margin:0;
  color:var(--ink-70);
}
.figure small{ font:400 .8rem/1 var(--body); letter-spacing:.1em;
  text-transform:uppercase; color:var(--ink-45); margin-inline-start:.7em }
.stand{
  max-width:48ch; margin:0; font-size:clamp(1.02rem,2.3vw,1.25rem);
  color:var(--ink-70);
}
.hero-foot{
  display:flex; flex-wrap:wrap; align-items:baseline; gap:.6rem 1.4rem;
  font-size:.8125rem; color:var(--ink-45);
  border-top:1px solid var(--ink-20); padding-top:.9rem;
}
.cue{ display:inline-flex; align-items:center; gap:.5rem; margin-inline-start:auto }
.cue i{
  width:1px; height:1.5rem; background:var(--ink-20); position:relative; display:block;
}
.cue i::after{
  content:""; position:absolute; inset-inline-start:-2px; width:5px; height:5px;
  background:var(--ink-45); border-radius:50%; animation:fall 2.4s ease-in-out infinite;
}
@keyframes fall{ 0%{top:0;opacity:0} 25%{opacity:1} 100%{top:1.2rem;opacity:0} }

/* hizkuntza eta iragazki-botoiak */
.seg{ display:inline-flex; border:1px solid var(--ink-20); background:#fff8;
  border-radius:999px; padding:2px }
.seg button{
  appearance:none; border:0; background:none; cursor:pointer; border-radius:999px;
  padding:.32rem .78rem; font-size:.8125rem; color:var(--ink-45); line-height:1.3;
}
.seg button[aria-pressed="true"]{ background:var(--ink); color:var(--paper) }
.ghost{
  appearance:none; cursor:pointer; background:none; border:1px solid var(--ink-20);
  border-radius:999px; padding:.34rem .9rem; font-size:.8125rem; color:var(--ink-70);
}
.ghost:hover{ border-color:var(--ink-45) }

/* ------------------------------------------------------------------ eszena */
.stage{ position:relative }
.stage-gfx{
  position:sticky; top:0; height:100svh; display:grid; place-items:center;
  overflow:clip;
}
.stage-gfx canvas{ width:100%; height:100% }
.stage-hud{
  position:absolute; inset-block-start:0; inset-inline-start:0;
  width:100%; max-width:var(--wrap); margin-inline:auto;
  padding:1rem; display:flex; gap:1.4rem; align-items:baseline;
  pointer-events:none; inset-inline:0;
}
@media (min-width:48rem){ .stage-hud{ padding:1.4rem 2rem } }
.stage-hud .yr{ font-size:1.5rem; color:var(--ink-45) }
.stage-hud dl{ display:flex; gap:1.3rem; margin:0; flex-wrap:wrap }
.stage-hud dt{
  font-size:.6875rem; letter-spacing:.11em; text-transform:uppercase;
  color:var(--ink-45);
}
.stage-hud dd{ margin:0; font-family:var(--disp); font-size:1.2rem }

.steps{ position:relative; z-index:2; padding-block:4rem 8rem }
.step{ min-height:92svh; display:flex; align-items:flex-end;
  padding:0 1rem 2.4rem }   /* estuan txartela behean: eraztunak goia hartzen du */
@media (min-width:48rem){ .step{ padding-inline:2rem } }
@media (min-width:60rem){ .step{ align-items:center; padding-bottom:0 } }
.step .card{
  width:100%; max-width:30rem; margin-inline:auto;
  background:color-mix(in srgb, var(--paper) 93%, transparent);
  backdrop-filter:blur(3px);
  border:1px solid var(--ink-20); border-radius:3px;
  padding:1.2rem 1.25rem; box-shadow:0 1px 0 #fff6 inset;
}
@media (min-width:60rem){
  .steps{ max-width:var(--wrap); margin-inline:auto }
  .step{ justify-content:flex-end }
  .step .card{ margin-inline:0 }
}
.step h3{
  font-family:var(--disp); font-weight:400; font-size:1.5rem; line-height:1.14;
  margin:0 0 .45rem;
}
.step p{ margin:0; color:var(--ink-70); font-size:.98rem }
.step .big{
  font-family:var(--disp); font-size:2.6rem; line-height:1; margin:0 0 .3rem;
}

/* ------------------------------------------------------------------- atalak */
.page-sec{ padding-block:4.5rem }
.page-sec--pale{ background:var(--paper-2) }
.page-sec--line{ border-top:1px solid var(--ink-20) }
.eyebrow{
  font-size:.75rem; letter-spacing:.16em; text-transform:uppercase;
  color:var(--ink-45); margin:0 0 .7rem;
}
.page-sec h2{
  font-family:var(--disp); font-weight:400; letter-spacing:-.008em;
  font-size:clamp(1.8rem,5vw,3rem); line-height:1.04; margin:0 0 .8rem;
  max-width:26ch;
}
.lede{ max-width:var(--text); color:var(--ink-70); margin:0 0 2rem; font-size:1.06rem }
.prose{ max-width:var(--text) }
.prose p{ margin:0 0 1.15rem }
.prose p:last-child{ margin-bottom:0 }
.prose b{ font-weight:600 }
.pull{
  font-family:var(--disp); font-size:clamp(1.5rem,4vw,2.3rem); line-height:1.18;
  margin:0 0 2rem; max-width:30ch; text-wrap:balance;
}
.warn{
  max-width:var(--text); margin:1.6rem 0 0; font-size:.875rem; color:var(--ink-45);
  border-inline-start:2px solid var(--ink-20); padding-inline-start:.9rem;
}

/* ------------------------------------------------- grafikoak eta oin-oharrak */
.chartbox{ position:relative; margin-block:1rem 0 }
.chart{ width:100%; height:auto; overflow:visible }
.tip{
  position:absolute; pointer-events:none; opacity:0; transition:opacity .12s;
  background:var(--ink); color:var(--paper); padding:.4rem .6rem; border-radius:3px;
  font-size:.8125rem; line-height:1.35; white-space:nowrap; z-index:5;
}
.tip.on{ opacity:1 }
.legend{
  display:flex; flex-wrap:wrap; gap:.5rem 1.2rem; margin-top:1rem;
  font-size:.8125rem; color:var(--ink-45);
}
.legend span{ display:inline-flex; align-items:center; gap:.42rem }
.legend i{ width:.72rem; height:.72rem; border-radius:50%; display:block }

/* -------------------------------------------------------- katalogo ofiziala */
.cat{ display:grid; gap:0; margin-block:1rem 0;
  border-top:1px solid var(--ink-20) }
.cat-row{
  display:grid; grid-template-columns:1fr auto; gap:.3rem 1rem;
  padding:.55rem 0; border-bottom:1px solid var(--ink-10); align-items:center;
}
@media (min-width:44rem){
  .cat-row{ grid-template-columns:15rem 8rem 1fr 7rem }
}
.cat-head{ border-bottom:1px solid var(--ink-20); padding-bottom:.4rem }
.cat-head .cat-name,
.cat-head .cat-n,
.cat-bars-h{
  font-size:.7rem; letter-spacing:.11em; text-transform:uppercase;
  color:var(--ink-45);
}
.cat-head .cat-n{ font-family:var(--body) }
.cat-bars-h{ display:none }
@media (min-width:44rem){ .cat-bars-h{ display:block } }
.cat-name{ font-size:1.02rem }
.cat-name i{ font-style:normal; color:var(--ink-45); font-size:.8125rem;
  display:block }
.cat-state{
  font-size:.75rem; letter-spacing:.09em; text-transform:uppercase;
  color:var(--ink-45); white-space:nowrap;
}
.cat-state[data-s="kritikoa"]{ color:var(--flag) }
.cat-bars{ display:flex; align-items:flex-end; gap:4px; height:2.4rem;
  grid-column:1/-1 }
@media (min-width:44rem){ .cat-bars{ grid-column:auto } }
.cat-bars span{ flex:0 0 22px; background:var(--ink-20); border-radius:1px 1px 0 0 }
.cat-n{ font-family:var(--disp); font-size:1.35rem; text-align:end; line-height:1.1 }
.cat-n small{ display:block; font:400 .75rem/1.4 var(--body); color:var(--ink-45);
  white-space:nowrap }
.cat-zero .cat-n{ color:var(--ink-45) }

/* ------------------------------------------------------------------- taula */
.search{ display:flex; flex-wrap:wrap; gap:.6rem; align-items:center;
  margin-block:0 .8rem }
.field{ position:relative; flex:1 1 15rem; max-width:22rem }
.field input{
  width:100%; appearance:none; background:#fff8; color:var(--ink);
  border:1px solid var(--ink-20); border-radius:999px;
  padding:.46rem 2.2rem .46rem .9rem; font:400 .9375rem/1.4 var(--body);
}
.field input::placeholder{ color:var(--ink-45) }
.field button{
  position:absolute; inset-block:0; inset-inline-end:.3rem; width:1.7rem;
  appearance:none; border:0; background:none; color:var(--ink-45); cursor:pointer;
  font-size:1.1rem; line-height:1;
}
.hint{ font-size:.8125rem; color:var(--ink-45); margin:.1rem 0 .7rem }
.tbl{ overflow:auto; border:1px solid var(--ink-20); border-radius:3px;
  background:#fff6 }
table{ width:100%; border-collapse:collapse; font-size:.9375rem }
thead th{
  position:sticky; top:0; z-index:1; background:var(--paper);
  text-align:start; font-weight:500; font-size:.75rem; letter-spacing:.09em;
  text-transform:uppercase; color:var(--ink-45);
  padding:.6rem .7rem; border-bottom:1px solid var(--ink-20); white-space:nowrap;
}
thead th button{
  appearance:none; border:0; background:none; cursor:pointer; padding:0;
  font:inherit; letter-spacing:inherit; text-transform:inherit; color:inherit;
}
thead th[aria-sort] button{ color:var(--ink) }
tbody td{ padding:.52rem .7rem; border-bottom:1px solid var(--ink-10);
  vertical-align:baseline }
tbody tr:last-child td{ border-bottom:0 }
.num{ text-align:end; white-space:nowrap }
.bar{ display:block; height:.3rem; border-radius:1px; min-width:1px;
  margin:.2rem 0 0 auto }   /* zifraren azpian, eskuinean lerrokatuta */
.dot{ width:.6rem; height:.6rem; border-radius:50%; display:inline-block;
  margin-inline-end:.45rem; vertical-align:baseline }
.tag{
  font-size:.6875rem; letter-spacing:.07em; text-transform:uppercase;
  color:var(--ink-45); border:1px solid var(--ink-20); border-radius:2px;
  padding:.05rem .32rem; white-space:nowrap;
}
.tag[data-s="kritikoa"]{ color:var(--flag); border-color:color-mix(in srgb,var(--flag) 40%, transparent) }

/* -------------------------------------------------------------- mugimenduak */
.flow{ display:grid; gap:1.2rem; margin-block:1rem 0 }
@media (min-width:52rem){ .flow{ grid-template-columns:1fr 1fr; gap:2.4rem } }
.flow-card{ border-top:1px solid var(--ink-20); padding-top:.9rem }
.flow-card h3{ font-family:var(--disp); font-weight:400; font-size:1.25rem;
  margin:0 0 .5rem }
.flow-card p{ margin:0; font-size:.9375rem; color:var(--ink-70) }
.rows{ margin:.8rem 0 0; display:grid; gap:.42rem }
.rows div{ display:grid; grid-template-columns:8.5rem 1fr auto; gap:.7rem;
  align-items:center; font-size:.875rem }
.rows b{ font-weight:400; color:var(--ink-70) }
.rows i{ display:block; height:.55rem; background:var(--ink-20); border-radius:1px }
.rows span{ font-variant-numeric:tabular-nums; color:var(--ink-45) }

/* ----------------------------------------------------------------- amaiera */
.page-sec--end{ background:var(--ink); color:var(--paper) }
.page-sec--end .eyebrow,
.page-sec--end .prose p{ color:color-mix(in srgb, var(--paper) 72%, transparent) }
.page-sec--end h2{ color:var(--paper) }
.endline{
  font-family:var(--disp); font-size:clamp(1.5rem,4vw,2.4rem); line-height:1.16;
  margin:2.2rem 0 0; max-width:30ch; color:var(--paper);
}

/* ------------------------------------------------------------- metodologia */
.mgrid{ display:grid; gap:1.6rem 2.4rem }
@media (min-width:44rem){ .mgrid{ grid-template-columns:repeat(2,1fr) } }
@media (min-width:68rem){ .mgrid{ grid-template-columns:repeat(3,1fr) } }
.mgrid section{ border-top:1px solid var(--ink-20); padding-top:.85rem }
.mgrid h3{ font-size:.8125rem; letter-spacing:.1em; text-transform:uppercase;
  margin:0 0 .5rem; font-weight:500; color:var(--ink-45) }
.mgrid p{ margin:0 0 .7rem; font-size:.9375rem; color:var(--ink-70) }
.mgrid p:last-child{ margin-bottom:0 }

/* --------------------------------------------------------------------- oina */
.foot{ border-top:1px solid var(--ink-20); padding-block:2rem 3rem;
  font-size:.8125rem; color:var(--ink-45) }
.foot .wrap{ display:flex; flex-wrap:wrap; gap:.7rem 1.4rem; align-items:center }
.foot .disp{ font-size:1.1rem; color:var(--ink-70) }
.foot .by{ margin-inline-end:auto }

/* ------------------------------------------- partekatzeko txartela (1200x630)
   Txartelak ez du diseinu propiorik: orri bera da, `og` klasearekin. Hala
   ezin da inoiz orritik aldendu — bat aldatzen bada, bestea ere bai. */
html.og, html.og body{ width:1200px; height:630px; overflow:hidden }
html.og main, html.og .foot, html.og .hero-bar, html.og .hero-foot{ display:none }
html.og .hero{ min-height:630px; height:630px; border:0 }
html.og .hero canvas{ opacity:1 }
html.og .hero-inner{ padding:3.2rem 3.4rem; max-width:none }
html.og .hero-mid{ padding-block:0; max-width:54% }
html.og .figure{ font-size:2.1rem; margin-bottom:.2rem }
html.og h1{ font-size:5.2rem; margin:0 0 .22em }
html.og .stand{ font-size:1.3rem; max-width:34ch }

/* ------------------------------------------------------- mugimendua gutxiago */
@media (prefers-reduced-motion:reduce){
  *{ animation-duration:.001ms !important; animation-iteration-count:1 !important;
     transition-duration:.001ms !important; scroll-behavior:auto !important }
}

/* ------------------------------------------------------------------ papera */
@media print{
  :root{ --paper:#fff; --paper-2:#fff }
  .hero{ min-height:auto; border:0 }
  .hero canvas, .cue, .seg, .ghost, .search, .stage-gfx{ display:none !important }
  .stage{ display:none }
  body{ font-size:10.5pt }
  .page-sec{ padding-block:1.2rem; break-inside:avoid }

    <p><b>Zenbat buru?</b> Bizkaian 84.034 abere jaio eta erregistratu dira hiru urtean (2023–2025): 50.194 behi, 22.122 ardi, 5.644 ahuntz, 5.403 zaldi eta 663 asto. Espezie bakoitzak bere egutegia du: arkumeen % 58,3 urtarrilean eta otsailean jaiotzen da, moxalen % 60,8 apirilean eta maiatzean. Guztira 92 arraza-familia daude, baina bakar batek — mestizoek — 31.868 abere biltzen ditu. Euskal Arraza Autoktonoen Katalogo Ofizialean (81/2015 Dekretua) dauden hamalau abere-arrazatatik hamaikak dute jaiotzarik erregistroan: betizuak 117 hiru urtean, Enkarterriko astoak 185, pottokak 428. Azpigorri ahuntza, katalogoak «kritiko» gisa jotzen duena, 698tik 337ra jaitsi da bi urtean. Eta erregistratutako arkumeen %90,9 emeak dira: biologiak ez du hori egiten, erregistroak baizik.</p>
    <p><b>¿Cuántas cabezas?</b> En Bizkaia han nacido y se han registrado 84.034 cabezas de ganado en tres años (2023–2025): 50.194 bovinos, 22.122 ovinos, 5.644 caprinos, 5.403 equinos y 663 asnos. Cada especie tiene su calendario: el 58,3 % de los corderos nace en enero y febrero, el 60,8 % de los potros en abril y mayo. Hay 92 familias de razas, pero una sola —los mestizos— reúne 31.868 cabezas. De las catorce razas ganaderas del Catálogo Oficial de Razas Animales Autóctonas Vascas (Decreto 81/2015), once tienen nacimientos en el registro: 117 betizu en tres años, 185 asnos de las Encartaciones, 428 pottokas. La cabra Azpigorri, que el catálogo considera «crítica», ha caído de 698 a 337 en dos años. Y el 90,9 % de los corderos registrados son hembras: eso no lo hace la biología, lo hace el registro.</p>

  method:[
    {h:"Iturria", p:["<b>Open Data Bizkaia</b>, <code>explotaciones-ganaderas</code> datu-multzoa, CKAN <code>datastore_search</code> APIaren bidez. Hiru taula-mota pakete berean: ustiategien erregistroa (52.488 ilara, 2021–2025), jaiotzak (84.058 ilara) eta mugimenduak (63.809 gida).","Ez da beste daturik erabili, salbuespen bakarra arrazen egoera ofiziala: 81/2015 Dekretua, EHAA 110, 2015-06-15."]},
    {h:"Zergatik 2023–2025", p:["Jaiotzen taulan 84.058 ilara daude, baina 13 urte osatu gabeetakoak dira (2008tik 2026ra sakabanatuta). Hiru urte osoak bakarrik hartu dira. Beste 11 ilarak identifikazio-zenbakia errepikatzen zuten, eta behin bakarrik zenbatu dira: <b>84.034 animalia</b>."]},
    {h:"Hitzak", p:["Erregistro honetan dagoena ez da «animalia» orokorra: <b>abereak</b> dira — abeltzaintzako ustiategietan jaioak eta banan-banan identifikatuak. Horregatik erabiltzen da <i>abere</i> orri osoan eta ez <i>animalia</i>: txakur bat ere animalia da, baina ez dago hemen, eta basurdeak ere ez, salbu eta ustiategi batetik mugitzen direnean. Gaztelaniazko bertsioan <i>ganado</i> eta <i>cabezas</i> dira termino baliokideak."]},
    {h:"Egunak eta hilabeteak", p:["Erregistratutako abereen % 16,1 hilabete baten lehen egunean dago idatzita: ardietan % 38,6, behietan % 4,5. Egun zehatza ez dago beti jakinda, eta hilaren lehena idazten da. Horregatik ez da egun bati buruzko baieztapenik egiten orrian, eta hilabetea erabiltzen da neurri gisa. Eraztunean zutabe horiek moztuta marrazten dira, eta benetako kopurua puntan idazten da."]},
    {h:"Arrazak nola batu diren", p:["Iturriak arraza bera bi mailatan etiketatzen du: batzuetan familia («LATXA») eta batzuetan aldaera («LATXA CARA NEGRA»). Horrek aldaeren serieak fidagarri gabe uzten ditu: aldaera baten beherakada etiketatze-aldaketa bat izan daiteke. Dena <b>familia mailan</b> neurtzen da, eta aldaerak informazio gisa gordetzen dira, ez serie gisa."]},
    {h:"Maiuskulak eta kodeak", p:["Iturriak maiuskulak eta minuskulak nahasten ditu («FRISONA», «Conjunto Mestizo»), eta kodeak Excel moduan bilduta datoz (<code>=&quot;022&quot;</code>). Biak normalizatu dira. Eremuen izenak elebidunak dira («UDALERRIA/MUNICIPIO»), eta izen bat bestearen barruan dago: <code>LUGAR_DESTINO</code> bilatzeak <code>CODIGO_LUGAR_DESTINO</code> ere harrapatzen du, eta kodea itzultzen du izenaren ordez. Datu-multzo hau berrerabiltzen duenak zehatz bilatu behar du, azpikateaz fidatu gabe."]},
    {h:"Sexuaren ratioa", p:["Behietan % 51,9 emeak dira; ardietan % 90,9. Ez da hemen esaten zergatik gertatzen den — erregistroak ez du azaltzen. Esaten dena da erregistroak ez dituela jaiotza guztiak biltzen, eta zifra hori dela horren frogarik argiena."]},
    {h:"Zer ez duen ikusten", p:["Txerriak eta hegaztiak ez dira banan-banan identifikatzen erregistro honetan, eta beraz Euskal Txerria, Euskal Oiloa eta Euskal Antzara — hirurak «kritiko» katalogo ofizialean — zero jaiotzarekin agertzen dira. Hori erregistroaren muga da, ez arrazen egoera."]},
    {h:"Eraztuna", p:["Eszena nagusia eskuz idatzitako <b>canvas</b> bat da, kanpo-liburutegirik gabe: 84.034 marratxo erradial fotograma bakoitzean. Eguna → angelua mapaketa bakarra da eszena guztietan, eta horregatik marratxoak erradialki bakarrik mugitzen dira: begiak abere berberak jarraitu ahal die eraztun handia bost gurpil bihurtzen denean."]},
    {h:"Zifra bakoitza", p:["Orrian argitaratutako 53 zifra iturri gordinetik berriro kalkulatzen dira, trinkotzetik erabat independenteki (<code>verify.py</code>): beste kode-bide bat, beste egitura bat. Grafikoak eta taulak datu trinkotuetatik sortzen dira zuzenean; egiaztapenak eskuz idatzitako testuko zifrak ere kontrolatzen ditu, eta hiru desadostasun atzeman zituen argitaratu aurretik — bi ehuneko biribilduta zeuden, eta urteko guztizko bat bikoiztuak kendu aurretikoa zen. Prozesu osoa errepikagarria da: script bat jaisteko, beste bat garbitzeko, beste bat egiaztatzeko, beste bat muntatzeko."]},
    {h:"Erabilgarritasuna", p:["Elebiduna, egoera URLan gordetzen duena esteka partekagarrietarako, teklatuz nabigagarria, CSV gisa deskargagarria, pantaila txikietara egokitua (390 px-tik gora probatuta) eta paperean inprimagarria. <code>prefers-reduced-motion</code> eskatzen duenari animazioak eten egiten zaizkio. JavaScriptik gabe, albistearen laburpena agertzen da, bi hizkuntzatan."]}

    "El registro ganadero de Bizkaia contiene <b>84.034 cabezas de ganado</b> entre 2023 y 2025: 50.194 bovinos, 22.122 ovinos, 5.644 caprinos, 5.403 equinos, 663 asnos y ocho mulos. Cada uno con su número de identificación, fecha de nacimiento, sexo, raza y explotación. No hay nombres de personas: las explotaciones van por código.",
    "La primera cifra llamativa es el sexo. En bovinos las hembras son el 51,9 % y los machos el 48,1 % — eso es lo que da la biología. En ovinos, en cambio, el <b>90,9 %</b> de las cabezas registradas son hembras, y en caprinos el 87,5 %. Las ovejas no paren diez veces menos machos.",
    "La explicación está en el propio registro: no todo el ganado se identifica en el mismo momento, y los que salen antes de la explotación —corderos jóvenes, sobre todo— no llegan nunca a esta lista. Lo que el registro ve no es lo que nació; es <b>lo que iba a quedarse</b>. Los datos no son peores por eso: dicen otra cosa, y hay que saber cuál.",
    "Lo mismo ocurre con el día. El <b>16,1 % de las cabezas registradas</b> en tres años está anotado el día 1 de algún mes — 13.521 cabezas en doce días. En bovinos es solo el 4,5 %, pero en ovinos el 38,6 % y en caprinos el 38,0 %. El día exacto no siempre se conoce, y se escribe el primero del mes. Por eso aquí no se hace nunca ninguna afirmación sobre un día concreto: <b>el mes es la unidad fiable</b>.",
    "La segunda cifra es la caída. En tres años los nacimientos han bajado de <b>29.619 a 26.077</b>, un 12 %. Pero no es general: en bovinos no hay cambio (16.888 y 16.795), y en equinos tampoco. La caída está en ovinos (28 %), caprinos (43 %) y asnos (33 %). Lo que desaparece no es «la ganadería»: es el rebaño.",
    "Y la tercera son las razas. Hay 92 familias de razas en el registro, pero una sola —los mestizos— reúne <b>31.868 cabezas</b>: más de uno de cada tres. En el extremo, razas con un solo animal en tres años: hannoveriana, normanda, limiana. Entre medias están las razas vascas, y esas sí tienen un catálogo oficial."

/* ------------------------------------------------------------------- egoera */
const S = {
  lang: "eu",
  scene: 0,
  q: "",
  filt: "all",
  sort: { col: "t", dir: -1 },
};
let t = T.eu;

/* Zenbakiak eskuz formateatzen dira. `Intl`-ek ez du beti `eu-ES` ezagutzen,
   eta orduan ingelesezko komara jotzen du: «84,034». Euskaraz eta gaztelaniaz
   milakoen bereizlea puntua da, eta hamartarrena koma. */
function num(v){
  const neg = v < 0, s = String(Math.round(Math.abs(v)));
  let out = "";
  for (let i = 0; i < s.length; i++){
    if (i && (s.length - i) % 3 === 0) out += ".";
    out += s[i];
  }
  return (neg ? "\u2212" : "") + out;
}
function pct(v, d){
  const n = Math.abs(v).toFixed(d | 0).replace(".", ",");
  const s = (v < 0 ? "\u2212" : "") + n;
  return t.lang === "eu" ? "% " + s : s + " %";
}

const el = s => document.querySelector(s);
const els = s => Array.from(document.querySelectorAll(s));

/* Hilabeteen hasierako egunak eraztunerako goian daude (MSTART). */
const monthOf = d => { let m = 11; while (MSTART[m] > d) m--; return m; };

/* ===========================================================================
   1 · ERAZTUNA
   Animalia bakoitza marratxo erradial bat da. Eguna → angelua mapaketa bakarra
   da eszena guztietan, beraz marratxoak erradialki bakarrik mugitzen dira.
=========================================================================== */

/* Espezieen indize-zerrendak, behin bakarrik: fotograma bakoitzean espeziez
   taldekatuta marrazten da, trazu bat kolore bakoitzeko. */
const MSTART = [0,31,60,91,121,152,182,213,244,274,305,335,365];
const IS_FIRST = new Uint8Array(366);
for (let m = 0; m < 12; m++) IS_FIRST[MSTART[m]] = 1;

/* Bi zerrenda espezieko: hilaren lehen egunean erregistratutakoak eta
   gainerakoak. Hilaren 1a ez da jaiotza-eguna askotan, erregistroaren
   biribiltzea baizik, eta eszena batek hori erakusten du. */
const BY_SP = (() => {
  const a = SP_KEY.map(() => []), b = SP_KEY.map(() => []);
  for (let i = 0; i < N; i++) (IS_FIRST[DAY(i)] ? a : b)[SPI(i)].push(i);
  return SP_KEY.map((_, s) => ({ one: Int32Array.from(a[s]), rest: Int32Array.from(b[s]) }));
})();

/* Angelua eta bere sinua/kosinua egun bakoitzeko: 366 balio, behin. */
const COS = new Float32Array(366), SIN = new Float32Array(366);
for (let d = 0; d < 366; d++){
  const a = (d / 365) * Math.PI * 2 - Math.PI / 2;
  COS[d] = Math.cos(a); SIN[d] = Math.sin(a);
}

function drawBox(w, h, forHero){
  if (forHero){
    /* Partekatzeko txartelean testua ezkerrean doa eta eraztuna eskuinean.
       Pantaila estuan eraztuna beherago doa: bestela izenburuaren azpian
       geratzen da eta biak irakurgaitz bihurtzen dira. */
    const og = document.documentElement.classList.contains("og");
    const narrow = !og && w < 700;
    const m = og ? Math.min(w, h) * 0.98 : narrow ? w * 0.94 : Math.min(w, h) * 0.92;
    const cx = og ? w * 0.70 : w * 0.5;
    const cy = narrow ? h * 0.73 : h * 0.5;
    return { x: cx - m / 2, y: cy - m / 2, w: m, h: m };
  }
  /* Pantaila zabalean txartelak eskuinean daude, eta marrazkia ezkerrean.
     Estuan txartelak behean daude, eta marrazkiak goiko zatia hartzen du:
     eraztun bat ezin da txartel baten azpian geratu. */
  const wide = w >= 960, padT = wide ? 84 : 66;
  const bw = wide ? w * 0.53 : w;
  const bh = wide ? h - padT - 30 : h * 0.62 - padT;
  return { x: wide ? w * 0.025 : 6, y: padT, w: bw - 14, h: Math.max(140, bh) };
}

function wheels(scene, b){
  const out = [];
  if (scene <= 1){
    const m = Math.min(b.w, b.h);
    const g = { cx: b.x + b.w / 2, cy: b.y + b.h / 2, R: m * 0.27, room: m * 0.145 };
    for (let i = 0; i < NWHEEL; i++) out.push(g);
    return out;
  }
  if (scene === 4 || scene === 5){
    const focus = scene === 4 ? 1 : 3;
    const m = Math.min(b.w, b.h * 0.76);
    const cw = b.w / 4, sm = Math.min(cw, b.h * 0.2);
    let k = 0;
    for (let i = 0; i < NWHEEL; i++){
      if (i === focus) out.push({ cx: b.x + b.w / 2, cy: b.y + b.h * 0.40,
                                  R: m * 0.27, room: m * 0.145 });
      else { out.push({ cx: b.x + cw * (k + 0.5), cy: b.y + b.h * 0.89,
                        R: sm * 0.26, room: sm * 0.13 }); k++; }
    }
    return out;
  }
  /* Bost gurpil sareta batean. Zeldaren tamaina bi mugek erabakitzen dute,
     eta ilaren arteko tartea gurpilaren araberakoa da: bestela zutabeak
     zabalak direnean hutsune handi bat geratzen da erdian. */
  const cols = (b.w > b.h * 0.85 && b.w > 560) ? 3 : 2, rows = Math.ceil(NWHEEL / cols);
  const cw = b.w / cols, cell = Math.min(cw, b.h / rows);
  const stepY = Math.min(b.h / rows, cell * 1.1);
  const topY = b.y + (b.h - stepY * rows) / 2;
  for (let i = 0; i < NWHEEL; i++){
    const row = Math.floor(i / cols), inRow = i % cols;
    const inThis = Math.min(cols, NWHEEL - row * cols);
    const off = (b.w - inThis * cw) / 2;
    out.push({ cx: b.x + off + cw * (inRow + 0.5), cy: topY + stepY * (row + 0.5),
               R: cell * 0.25, room: cell * 0.132 });
  }
  return out;
}

/* Eszena bakoitzeko animalia bakoitzaren helmuga. Bi pasada: lehenengoan egun
   bakoitzean zenbat dauden, bigarrenean bakoitzari bere maila ematen. */
const bucket = new Int32Array(NWHEEL * 366 * 2);
const fillK  = new Int32Array(NWHEEL * 366 * 2);

function solve(scene, b, X, Y, LEN, LW, SPK){
  const wh = wheels(scene, b);
  const split = scene === 6;
  bucket.fill(0);
  for (let i = 0; i < N; i++){
    const w = WHEEL[SPI(i)];
    bucket[(w * 366 + DAY(i)) * 2 + (split ? SEX(i) : 0)]++;
  }
  /* Eskala ez da gehienekoarekin egiten, 98. pertzentilarekin baizik:
     hilaren lehen eguneko zutabeak zortzi aldiz luzeagoak dira, eta
     gehienekoak gainerako urtea ezabatuko luke. Zutabe horiek mugatuta
     marrazten dira, eta benetako kopurua puntan idazten da. */
  const unit = new Float64Array(NWHEEL), cap = new Float64Array(NWHEEL);
  const pool = [];
  for (let w = 0; w < NWHEEL; w++){
    pool.length = 0;
    for (let d = 0; d < 366; d++){
      const a = bucket[(w * 366 + d) * 2], c = bucket[(w * 366 + d) * 2 + 1];
      if (a) pool.push(a);
      if (c) pool.push(c);
    }
    pool.sort((x, y) => x - y);
    const p98 = pool.length ? pool[Math.min(pool.length - 1, Math.floor(pool.length * 0.98))] : 1;
    unit[w] = Math.min(3.2, Math.max(0.1, wh[w].room / Math.max(1, p98)));
    cap[w]  = wh[w].room * 1.35;
    LEN[w] = Math.max(0.55, unit[w] * 0.8);
    LW[w]  = Math.max(0.55, (2 * Math.PI * wh[w].R / 366) * 0.86);
  }
  for (let w = 0; w < NWHEEL; w++)
    for (let m = 0; m < 12; m++)
      SPK[w * 12 + m] = bucket[(w * 366 + MSTART[m]) * 2] + bucket[(w * 366 + MSTART[m]) * 2 + 1];
  fillK.fill(0);
  for (let i = 0; i < N; i++){
    const sp = SPI(i), w = WHEEL[sp], d = DAY(i);
    const side = split ? SEX(i) : 0;
    const idx = (w * 366 + d) * 2 + side;
    const k = fillK[idx]++;
    const g = wh[w];
    const out = Math.min(cap[w], k * unit[w]);
    const r = split && side === 1 ? g.R - Math.min(cap[w], (k + 1) * unit[w]) : g.R + out;
    X[i] = g.cx + COS[d] * r;
    Y[i] = g.cy + SIN[d] * r;
  }
  return wh;
}

/* Eszena bakoitzeko koloreak: espeziea, edo ilundua, edo tinta hutsa. */
function palette(scene){
  if (scene === 0) return SP_KEY.map(() => "rgba(29,26,20,.42)");
  if (scene === 4 || scene === 5){
    const focus = scene === 4 ? 1 : 3;
    return SP_KEY.map((_, s) => WHEEL[s] === focus ? COLOR[s] : INK_DIM);
  }
  return COLOR.slice();
}

function ring(canvas, opts){
  const o = Object.assign({ hero:false, scene:0 }, opts);
  const ctx = canvas.getContext("2d", { alpha:true });
  const X0 = new Float32Array(N), Y0 = new Float32Array(N);
  const X1 = new Float32Array(N), Y1 = new Float32Array(N);
  const Xd = new Float32Array(N), Yd = new Float32Array(N);
  const SPK = new Float64Array(NWHEEL * 12);
  const L0 = new Float64Array(NWHEEL), L1 = new Float64Array(NWHEEL);
  const W0 = new Float64Array(NWHEEL), W1 = new Float64Array(NWHEEL);
  let wh = null, w = 0, h = 0, dpr = 1, scene = o.scene, prev = o.scene;
  let t0 = 0, dur = 0, raf = 0, ready = false;
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

  function size(){
    const r = canvas.getBoundingClientRect();
    dpr = Math.min(2, window.devicePixelRatio || 1);
    w = Math.max(1, Math.round(r.width)); h = Math.max(1, Math.round(r.height));
    canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
  }

  function place(instant){
    const b = drawBox(w, h, o.hero);
    if (!ready || instant){
      wh = solve(scene, b, X1, Y1, L1, W1, SPK);
      X0.set(X1); Y0.set(Y1); L0.set(L1); W0.set(W1);
      Xd.set(X1); Yd.set(Y1);
      ready = true; dur = 0;
    } else {
      X0.set(Xd); Y0.set(Yd);
      for (let k = 0; k < NWHEEL; k++){ L0[k] = L1[k]; W0[k] = W1[k]; }
      wh = solve(scene, b, X1, Y1, L1, W1, SPK);
      t0 = performance.now(); dur = reduce ? 0 : 950;
    }
    tick();
  }

  const ease = p => p < .5 ? 4*p*p*p : 1 - Math.pow(-2*p + 2, 3) / 2;

  function paint(p){
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const colA = palette(prev), colB = palette(scene), e = ease(p);

    /* Pasada bat hilaren lehen egunekoentzat eta beste bat gainerakoentzat:
       3. eszenak lehenak bakarrik pizten ditu. */
    const tone = (sc, col, sp, first) =>
      sc === 3 ? (first ? COLOR[sp] : INK_DIM) : col[sp];

    for (let s = 0; s < SP_KEY.length; s++){
      const k = WHEEL[s];
      const len = L0[k] + (L1[k] - L0[k]) * e;
      for (let pass = 0; pass < 2; pass++){
        const ix = pass ? BY_SP[s].one : BY_SP[s].rest;
        if (!ix.length) continue;
        ctx.lineWidth = W0[k] + (W1[k] - W0[k]) * e;
        const cA = tone(prev, colA, s, pass), cB = tone(scene, colB, s, pass);
        ctx.strokeStyle = p >= 1 ? cB : (p < .45 ? cA : cB);
        ctx.globalAlpha = p >= 1 || p < .45 || p > .7 ? 1 : (p - .45) / .25;
        ctx.beginPath();
        for (let j = 0; j < ix.length; j++){
          const i = ix[j], d = DAY(i);
          const x = X0[i] + (X1[i] - X0[i]) * e, y = Y0[i] + (Y1[i] - Y0[i]) * e;
          Xd[i] = x; Yd[i] = y;
          const hx = COS[d] * len * .5, hy = SIN[d] * len * .5;
          ctx.moveTo(x - hx, y - hy); ctx.lineTo(x + hx, y + hy);
        }
        ctx.stroke();
      }
    }
    ctx.globalAlpha = 1;
    if (!o.hero) chrome(p >= 1 ? 1 : Math.max(0, (p - .55) / .45));
  }

  /* Gurpilen apaingarria: hilabeteen marrak, izenak eta espeziearen etiketa. */
  function chrome(a){
    if (a <= 0.01 || !wh) return;
    const big = scene <= 1 || scene === 4 || scene === 5;
    const seen = new Set();
    ctx.save();
    ctx.globalAlpha = a;
    for (let k = 0; k < NWHEEL; k++){
      const g = wh[k], tag = g.cx + "," + g.cy + "," + g.R;
      if (seen.has(tag)) continue;
      seen.add(tag);
      const focus = scene === 4 ? 1 : scene === 5 ? 3 : -1;
      const dim = focus >= 0 && k !== focus;
      ctx.strokeStyle = dim ? "rgba(29,26,20,.10)" : "rgba(29,26,20,.22)";
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(g.cx, g.cy, g.R, 0, Math.PI * 2); ctx.stroke();
      /* Gurpil txikietan hamabi hilabeteren izenak ez dira irakurtzen:
         lauzpabost bakarrik idazten dira, markak hor daude beti. */
      const every = (big && !dim) || g.R > 110 ? 1 : g.R > 46 ? 3 : 0;
      ctx.fillStyle = dim ? "rgba(29,26,20,.30)" : "rgba(135,128,106,1)";
      ctx.font = `${Math.max(8, Math.min(11, g.R * 0.09))}px "Spectral", Georgia, serif`;
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      for (let m = 0; m < 12; m++){
        const d = MSTART[m], r1 = g.R - 4, r2 = g.R + 4;
        ctx.beginPath();
        ctx.moveTo(g.cx + COS[d] * r1, g.cy + SIN[d] * r1);
        ctx.lineTo(g.cx + COS[d] * r2, g.cy + SIN[d] * r2);
        ctx.stroke();
        if (!every || (m % every)) continue;
        const mid = (MSTART[m] + MSTART[m + 1]) / 2, rl = g.R - 15;
        ctx.fillText(t.months[m], g.cx + COS[Math.round(mid)] * rl,
                                  g.cy + SIN[Math.round(mid)] * rl);
      }
      if (scene >= 2){
        /* 6. eszenan arrak barrurantz pilatzen dira eta erdia betetzen dute:
           izena gurpilaren azpira joaten da orduan. */
        ctx.fillStyle = dim ? "rgba(29,26,20,.34)" : COLOR[k];
        ctx.font = `${Math.max(11, Math.min(20, g.R * 0.17))}px "Instrument Serif", Georgia, serif`;
        ctx.fillText(t.sp[SP_KEY[k]], g.cx,
                     scene === 6 ? g.cy + g.R + g.room * 1.35 + 14 : g.cy);
      }
      if (scene === 3 && !dim){
        /* Hilaren lehen eguneko zutabeak moztuta daude: benetako kopurua
           puntan idazten da, ezer ezkutatu gabe. */
        ctx.fillStyle = COLOR[k];
        ctx.font = `${Math.max(9, Math.min(12, g.R * 0.1))}px "Spectral", Georgia, serif`;
        for (let m = 0; m < 12; m++){
          const v = SPK[k * 12 + m];
          if (v < 150 || g.R < 38) continue;
          /* Etiketak txandaka barruago eta kanporago, ondokoekin ez talka egiteko. */
          const d = MSTART[m], rr = g.R + g.room * 1.35 + (m % 2 ? 9 : 20);
          ctx.fillText(num(v), g.cx + COS[d] * rr, g.cy + SIN[d] * rr);
        }
      }
      if (scene === 6 && !dim && g.R > 46){
        ctx.fillStyle = "rgba(85,80,63,1)";
        ctx.font = `13px "Spectral", Georgia, serif`;
        ctx.fillText("♀", g.cx, g.cy - g.R - g.room * 1.35 - 11);
        ctx.fillText("♂", g.cx, g.cy - g.R + g.room * 0.7);
      }
    }
    ctx.restore();
  }

  function tick(){
    cancelAnimationFrame(raf);
    const step = () => {
      const p = dur ? Math.min(1, (performance.now() - t0) / dur) : 1;
      paint(p);
      if (p < 1) raf = requestAnimationFrame(step);
      else prev = scene;
    };
    raf = requestAnimationFrame(step);
  }

  const api = {
    to(next){
      if (next === scene) return;
      prev = scene; scene = next; place(false);
      if (!o.hero) hud();
    },
    resize(){ size(); place(true); },
    repaint(){ paint(1); },
    get scene(){ return scene; }
  };
  size(); place(true);
  return api;
}

/* HUD: animalia-kopurua eta gailurra, eszenaren arabera */
function hud(){
  const sc = S.scene;
  const focus = sc === 4 ? "ardi" : sc === 5 ? "zaldi" : null;
  const row = focus ? RAW.sp.find(x => x.k === focus) : null;
  el("#hudN").textContent = num(sc === 3 ? RAW.round.one : row ? row.t : N);
  let best = 0, bi = 0;
  const m = row ? row.m : RAW.sp.reduce((a, x) => a.map((v, i) => v + x.m[i]), new Array(12).fill(0));
  m.forEach((v, i) => { if (v > best){ best = v; bi = i; } });
  el("#hudPeak").textContent = t.monthsLong[bi].replace(/^./, c => c.toUpperCase());
  const lab = el("#ringCanvas");
  if (lab) lab.setAttribute("aria-label", t.steps[sc].h + ". " + t.steps[sc].p);
}

/* ===========================================================================
   2 · ATALAK
=========================================================================== */
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const SP_OF = k => t.sp[k] || k;

/* Iturriak eskualdeen izenak gaztelaniaz dakartza. Euskarazko bertsioan
   euskaraz ematen dira; gaztelaniazkoan iturriko izena bera da. */
const REG_EU = {
  "País Vasco":"Euskadi", "Navarra":"Nafarroa", "Galicia":"Galizia",
  "Castilla y León":"Gaztela eta Leon", "Castilla la Mancha":"Gaztela-Mantxa",
  "Valencia":"Valentzia", "Rioja":"Errioxa", "Cantabria":"Kantabria",
  "Aragón":"Aragoi", "Asturias":"Asturias", "Andalucía":"Andaluzia",
  "Cataluña":"Katalunia", "Extremadura":"Extremadura", "Madrid":"Madril",
  "Francia":"Frantzia", "Murcia":"Murtzia", "Baleares":"Balearrak",
  "Canarias":"Kanariak", "Portugal":"Portugal"
};
const REG = n => t.lang === "eu" ? (REG_EU[n] || n) : n;

/* Hiru arraza-familiak euskaraz izendatu dira trinkotzean (iturriak izen bat
   baino gehiago erabiltzen duelako); gaztelaniaz izen ofiziala ematen da. */
const FAM_ES = {
  "Mestizoak":"Mestizos",
  "Enkarterriko astoa":"Asno de las Encartaciones",
  "Euskal Herriko Mendiko Zaldia":"Caballo de Monte del País Vasco"
};
const FAM = n => t.lang === "es" ? (FAM_ES[n] || n) : n;
const stateKey = o => o === "Crítica" ? "kritikoa" : o === "En peligro" ? "arriskuan" : "gabe";

/* ----------------------------------------------------------- eszenen txartelak */
function steps(){
  el("#steps").innerHTML = t.steps.map((s, i) => `
    <div class="step" data-i="${i}">
      <div class="card">
        ${s.n ? `<p class="big disp">${esc(s.n)}</p>` : ""}
        <h3>${esc(s.h)}</h3>
        <p>${esc(s.p)}</p>
      </div>
    </div>`).join("");
}

/* --------------------------------------------------------- katalogo ofiziala */
function catalogue(){
  /* Ordena: arrisku-maila ofiziala lehenik, eta maila bakoitzaren barruan
     jaiotza gehien dituztenak lehenengo. Hala irakurleak katalogoaren logika
     ikusten du, eta ondoan datuek dioten beste gauza. */
  const rank = o => o === "Crítica" ? 0 : o === "En peligro" ? 1 : 2;
  const rows = RAW.official.slice().sort((a, b) => rank(a.o) - rank(b.o) || b.t - a.t);
  const head = `<div class="cat-row cat-head">
      <div class="cat-name">${esc(t.cols.name)}</div>
      <div class="cat-state">${esc(t.catCols.state)}</div>
      <div class="cat-bars-h">${esc(t.catCols.yrs)}</div>
      <div class="cat-n">${esc(t.catCols.births)}</div>
    </div>`;
  el("#cat").innerHTML = head + rows.map(o => {
    const mx = Math.max(1, ...o.y);
    const col = COLOR[SP_KEY.indexOf(o.sp)] || INK;
    const bars = o.y.map((v, i) => `<span title="${RAW.years[i]}: ${num(v)}" style="height:${
      o.t ? Math.max(3, (v / mx) * 100) : 3}%;background:${o.t ? col : "var(--ink-20)"}"></span>`).join("");
    const d = o.y[0] ? ((o.y[2] - o.y[0]) / o.y[0]) * 100 : 0;
    const delta = o.t
      ? `<small>${d >= 0 ? "↑" : "↓"} ${pct(Math.abs(d), 0)}</small>`
      : `<small>—</small>`;
    return `<div class="cat-row${o.t ? "" : " cat-zero"}">
      <div class="cat-name">${esc(FAM(o.n))}<i>${esc(SP_OF(o.sp))}</i></div>
      <div class="cat-state" data-s="${stateKey(o.o)}">${esc(t.states[o.o] || o.o)}</div>
      <div class="cat-bars">${bars}</div>
      <div class="cat-n">${num(o.t)}${delta}</div>
    </div>`;
  }).join("");
}

/* ----------------------------------------------------------- arrazen taula */
const COLDEF = [
  { k:"name", f:r => r.n,    kind:"txt" },
  { k:"sp",   f:r => r.sp,   kind:"txt" },
  { k:"off",  f:r => r.o ? (r.o === "Crítica" ? 3 : r.o === "En peligro" ? 2 : 1) : 0, kind:"n" },
  { k:"t",    f:r => r.t,    kind:"n" },
  { k:"y23",  f:r => r.y[0], kind:"n" },
  { k:"y24",  f:r => r.y[1], kind:"n" },
  { k:"y25",  f:r => r.y[2], kind:"n" },
  { k:"fem",  f:r => r.t ? r.f / r.t : 0, kind:"n" },
  { k:"var",  f:r => r.v.length, kind:"n" },
];

function rowsNow(){
  const q = S.q.trim().toLowerCase();
  return RAW.fam.filter(r => {
    if (S.filt === "kat" && !r.o) return false;
    if (S.filt !== "all" && S.filt !== "kat" && r.sp !== S.filt) return false;
    if (!q) return true;
    if (FAM(r.n).toLowerCase().includes(q) || r.n.toLowerCase().includes(q)) return true;
    return r.v.some(v => String(v[0]).toLowerCase().includes(q));
  }).sort((a, b) => {
    const c = COLDEF.find(x => x.k === S.sort.col) || COLDEF[3];
    const av = c.f(a), bv = c.f(b);
    if (c.kind === "txt") return String(av).localeCompare(String(bv), t.loc) * S.sort.dir * -1;
    return (av - bv) * S.sort.dir;
  });
}

function table(){
  const rows = rowsNow(), mx = Math.max(1, ...RAW.fam.map(r => r.t));
  const head = COLDEF.map(c => {
    const on = S.sort.col === c.k;
    const cls = c.kind === "n" && c.k !== "off" ? ' class="num"' : "";
    return `<th${cls}${on ? ` aria-sort="${S.sort.dir < 0 ? "descending" : "ascending"}"` : ""}>
      <button type="button" data-col="${c.k}">${esc(t.cols[c.k])}${on ? (S.sort.dir < 0 ? " ↓" : " ↑") : ""}</button></th>`;
  }).join("");
  el("#brTable").querySelector("thead").innerHTML = `<tr>${head}</tr>`;
  const body = rows.map(r => {
    const col = COLOR[SP_KEY.indexOf(r.sp)] || INK;
    const tag = r.o ? `<span class="tag" data-s="${stateKey(r.o)}">${esc(t.states[r.o] || r.o)}</span>` : "";
    return `<tr>
      <td><span class="dot" style="background:${col}"></span>${esc(FAM(r.n))}
        ${r.v.length ? `<i style="color:var(--ink-45);font-style:normal;font-size:.8em"> · ${esc(r.v.map(v => v[0]).join(", "))}</i>` : ""}</td>
      <td>${esc(SP_OF(r.sp))}</td>
      <td>${tag}</td>
      <td class="num">${num(r.t)}<span class="bar" style="width:${(r.t / mx) * 100}%;background:${col};opacity:.5"></span></td>
      <td class="num">${num(r.y[0])}</td>
      <td class="num">${num(r.y[1])}</td>
      <td class="num">${num(r.y[2])}</td>
      <td class="num">${r.t ? pct((r.f / r.t) * 100, 1) : "—"}</td>
      <td class="num">${r.v.length || "—"}</td>
    </tr>`;
  }).join("");
  el("#brTable").querySelector("tbody").innerHTML =
    body || `<tr><td colspan="9" style="color:var(--ink-45)">${esc(t.none)}</td></tr>`;
  el("#qcount").textContent = rows.length === RAW.fam.length
    ? t.count(num(rows.length)) : t.countOf(num(rows.length), num(RAW.fam.length));
}

function csv(){
  const head = ["arraza","espeziea","81/2015","guztira","2023","2024","2025","emeak","aldaerak"];
  const q = s => `"${String(s).replace(/"/g, '""')}"`;
  const lines = [head.join(",")].concat(rowsNow().map(r => [
    q(FAM(r.n)), q(SP_OF(r.sp)), q(r.o || ""), r.t, r.y[0], r.y[1], r.y[2],
    r.t ? (r.f / r.t).toFixed(4) : "", r.v.length
  ].join(",")));
  const blob = new Blob(["﻿" + lines.join("\n")], { type:"text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = t.csvFile;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

/* ---------------------------------------------------- hilabeteen grafikoa */
function calendar(){
  const svg = el("#cal"), sp = RAW.sp.filter(x => x.t > 50);
  const cols = 3, rows = Math.ceil(sp.length / cols);
  const W = 1000, PAD = 14, cw = (W - PAD * 2) / cols, chh = 154;
  const H = PAD * 2 + rows * chh;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  let out = "";
  sp.forEach((s, i) => {
    const cx = PAD + (i % cols) * cw, cy = PAD + Math.floor(i / cols) * chh;
    const iw = cw - 26, ih = chh - 54, mx = Math.max(...s.m);
    const col = COLOR[SP_KEY.indexOf(s.k)] || INK;
    const px = m => cx + 8 + (iw / 11) * m;
    const py = v => cy + 34 + ih - (v / mx) * ih;
    const pts = s.m.map((v, m) => `${px(m).toFixed(1)},${py(v).toFixed(1)}`).join(" ");
    out += `<g>
      <text x="${cx + 8}" y="${cy + 14}" font-family="Instrument Serif, Georgia, serif"
        font-size="18" fill="${col}">${esc(t.sp[s.k])}</text>
      <text x="${cx + 8}" y="${cy + 28}" font-size="10.5" fill="#87806a"
        >${num(s.t)} · ${pct((s.f / s.t) * 100, 1)} ${esc(t.female)}</text>
      <line x1="${cx + 8}" y1="${cy + 34 + ih}" x2="${cx + 8 + iw}" y2="${cy + 34 + ih}"
        stroke="#cfc7b4" stroke-width="1"/>
      <polygon points="${cx + 8},${cy + 34 + ih} ${pts} ${cx + 8 + iw},${cy + 34 + ih}"
        fill="${col}" fill-opacity=".16"/>
      <polyline points="${pts}" fill="none" stroke="${col}" stroke-width="1.6"
        stroke-linejoin="round"/>`;
    s.m.forEach((v, m) => {
      out += `<circle class="cdot" data-sp="${s.k}" data-m="${m}" cx="${px(m).toFixed(1)}"
        cy="${py(v).toFixed(1)}" r="7" fill="transparent"/>`;
    });
    [0, 3, 6, 9].forEach(m => {
      out += `<text x="${px(m).toFixed(1)}" y="${cy + 34 + ih + 14}" font-size="9.5"
        text-anchor="middle" fill="#87806a">${esc(t.months[m])}</text>`;
    });
    out += `</g>`;
  });
  svg.innerHTML = out;
  svg.setAttribute("aria-label", t.calTitle + ". " + sp.map(s =>
    `${t.sp[s.k]}: ${num(s.t)}`).join("; "));

  const tip = el("#tipC"), box = el("#calbox");
  const show = (c) => {
    const s = RAW.sp.find(x => x.k === c.dataset.sp), m = +c.dataset.m;
    const r = box.getBoundingClientRect(), p = c.getBoundingClientRect();
    tip.innerHTML = `<b>${esc(t.sp[s.k])}</b> · ${esc(t.monthsLong[m])}<br>${num(s.m[m])} ${esc(t.animals)}`;
    tip.classList.add("on");
    tip.style.left = Math.max(4, Math.min(r.width - tip.offsetWidth - 4,
      p.left - r.left + p.width / 2 - tip.offsetWidth / 2)) + "px";
    tip.style.top = (p.top - r.top - tip.offsetHeight - 6) + "px";
  };
  svg.querySelectorAll(".cdot").forEach(c => {
    c.addEventListener("mouseenter", () => show(c));
    c.addEventListener("mouseleave", () => tip.classList.remove("on"));
  });
  let ci = -1;
  box.onkeydown = e => {
    const all = Array.from(svg.querySelectorAll(".cdot"));
    if (e.key === "ArrowRight" || e.key === "ArrowLeft"){
      ci = (ci + (e.key === "ArrowRight" ? 1 : -1) + all.length) % all.length;
      show(all[ci]); e.preventDefault();
    } else if (e.key === "Escape") tip.classList.remove("on");
  };
  box.onblur = () => tip.classList.remove("on");
}

/* ------------------------------------------------------------ mugimenduak */
function flow(){
  const M = RAW.move, bar = (v, mx, col) => `<i style="width:${Math.max(1, (v / mx) * 100)}%;background:${col || "var(--ink-20)"}"></i>`;
  const named = M.sp.filter(x => SP_KEY.includes(x[0]) && x[2] >= 200);
  const dest = M.dest.slice(0, 7), dmx = Math.max(...dest.map(d => d[2]));
  const tmx = Math.max(...named.map(x => x[2]));
  const medmx = Math.max(...named.map(x => x[4]));
  const catRows = [[t.flowIn, M.cat.barrukoa], [t.flowOut, M.cat.irteera], [t.flowBack, M.cat.sarrera]];
  const cmx = Math.max(...catRows.map(c => c[1]));
  const card = (k, rows) => `<div class="flow-card">
      <h3>${esc(t.flow[k].h)}</h3><p>${esc(t.flow[k].p)}</p>
      <div class="rows">${rows}</div></div>`;
  el("#flow").innerHTML =
    card("a", dest.map(d => `<div><b>${esc(REG(d[0]))}</b>${bar(d[2], dmx)}<span>${num(d[2])}</span></div>`).join("")) +
    card("b", named.map(x => {
      const col = COLOR[SP_KEY.indexOf(x[0])];
      return `<div><b>${esc(SP_OF(x[0]))}</b>${bar(x[3], tmx, col)}<span>${
        pct(x[1] ? (x[3] / x[2]) * 100 : 0, 0)}</span></div>`;
    }).join("")) +
    card("c", named.map(x => {
      const col = COLOR[SP_KEY.indexOf(x[0])];
      return `<div><b>${esc(SP_OF(x[0]))}</b>${bar(x[4], medmx, col)}<span>${num(x[4])}</span></div>`;
    }).join("")) +
    card("d", catRows.map(c => `<div><b>${esc(c[0])}</b>${bar(c[1], cmx)}<span>${num(c[1])} ${esc(t.guides)}</span></div>`).join(""));
}

/* ---------------------------------------------------------- testu-blokeak */
function prose(){
  el("#prose").innerHTML = t.prose.map(p => `<p>${p}</p>`).join("");
  el("#endBody").innerHTML = t.end.map(p => `<p>${p}</p>`).join("");
  el("#method").innerHTML = t.method.map(m =>
    `<section><h3>${esc(m.h)}</h3>${m.p.map(p => `<p>${p}</p>`).join("")}</section>`).join("");
}

/* ===========================================================================
   3 · HIZKUNTZA, EGOERA ETA ABIADURA
=========================================================================== */
let ringMain = null, heroRing = null;

function i18n(){
  document.documentElement.lang = t.lang;
  els("[data-i18n]").forEach(n => {
    const v = t[n.dataset.i18n];
    if (typeof v === "string") n.textContent = v;
  });
  els("[data-i18n-aria]").forEach(n => {
    const v = t[n.dataset.i18nAria];
    if (typeof v === "string"){ n.setAttribute("aria-label", v); if (n.tagName === "INPUT") n.placeholder = v; }
  });
  els("[data-lang]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === t.lang)));
  els("[data-filt]").forEach(b => { b.querySelector("span").textContent = t.filt[b.dataset.filt]; });
  el("#csv").querySelector("span").textContent = t.csv;
  el("#share").querySelector("span").textContent = t.share;
  el("#brLegend").textContent = t.brLegend;
  el("#calLegend").textContent = t.calLegend;
  document.title = t.title + " · " + (t.lang === "eu"
    ? "Bizkaian jaiotzen diren abereak, banan-banan"
    : "Las cabezas de ganado que nacen en Bizkaia, una a una");
}

function renderAll(){
  i18n(); steps(); catalogue(); table(); calendar(); flow(); prose(); hud();
  observe();
  if (ringMain) ringMain.repaint();
  if (heroRing) heroRing.repaint();
}

function setLang(l, push){
  if (!T[l] || l === S.lang) return;
  S.lang = l; t = T[l];
  try { localStorage.setItem("zenbat-buru-lang", l); } catch (e) {}
  renderAll();
  if (push !== false) hash();
}

function hash(){
  const p = new URLSearchParams();
  if (S.lang !== "eu") p.set("lang", S.lang);
  if (S.filt !== "all") p.set("f", S.filt);
  if (S.q) p.set("q", S.q);
  const s = p.toString();
  history.replaceState(null, "", s ? "#" + s : location.pathname + location.search);
}

function fromHash(){
  const p = new URLSearchParams(location.hash.replace(/^#/, ""));
  let l = p.get("lang");
  if (!l){ try { l = localStorage.getItem("zenbat-buru-lang"); } catch (e) {} }
  if (!l){ l = (navigator.language || "eu").toLowerCase().startsWith("es") ? "es" : "eu"; }
  if (T[l]) { S.lang = l; t = T[l]; }
  const f = p.get("f");
  if (f && (f === "kat" || f === "all" || SP_KEY.includes(f))) S.filt = f;
  const q = p.get("q");
  if (q) S.q = q;
}

/* --------------------------------------------------------------- behatzailea */
let io = null;
function observe(){
  if (io) io.disconnect();
  io = new IntersectionObserver(ent => {
    ent.forEach(e => {
      if (!e.isIntersecting) return;
      const i = +e.target.dataset.i;
      if (i === S.scene) return;
      S.scene = i;
      if (ringMain) ringMain.to(i);
      hud();
    });
  }, { rootMargin: "-45% 0px -45% 0px", threshold: 0 });
  els(".step").forEach(s => io.observe(s));
}

/* ------------------------------------------------------------------ gertaerak */
function wire(){
  els("[data-lang]").forEach(b => b.addEventListener("click", () => setLang(b.dataset.lang)));

  els("[data-filt]").forEach(b => b.addEventListener("click", () => {
    S.filt = b.dataset.filt;
    els("[data-filt]").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
    table(); hash();
  }));

  const q = el("#q");
  q.value = S.q;
  let qt = 0;
  q.addEventListener("input", () => {
    S.q = q.value;
    clearTimeout(qt); qt = setTimeout(() => { table(); hash(); }, 110);
  });
  el("#qclear").addEventListener("click", () => { q.value = ""; S.q = ""; table(); hash(); q.focus(); });

  el("#brTable").addEventListener("click", e => {
    const b = e.target.closest("button[data-col]");
    if (!b) return;
    const c = b.dataset.col;
    if (S.sort.col === c) S.sort.dir *= -1;
    else S.sort = { col: c, dir: c === "name" || c === "sp" ? 1 : -1 };
    table();
  });

  el("#csv").addEventListener("click", csv);

  el("#share").addEventListener("click", async () => {
    const url = location.href;
    try {
      if (navigator.share) await navigator.share({ title: t.title, url });
      else { await navigator.clipboard.writeText(url);
        const s = el("#share").querySelector("span"), old = s.textContent;
        s.textContent = t.shared; setTimeout(() => { s.textContent = old; }, 1600); }
    } catch (e) {}
  });

  let rt = 0;
  const onResize = () => {
    clearTimeout(rt);
    rt = setTimeout(() => {
      if (ringMain) ringMain.resize();
      if (heroRing) heroRing.resize();
      calendar();
    }, 140);
  };
  addEventListener("resize", onResize);
  addEventListener("orientationchange", onResize);
  if (window.ResizeObserver){
    const ro = new ResizeObserver(onResize);
    ro.observe(el("#ringCanvas")); ro.observe(el("#heroCanvas"));
  }
}

/* ---------------------------------------------------------------- abiatzea */
function boot(){
  fromHash();
  renderAll();
  els("[data-filt]").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.filt === S.filt)));
  heroRing = ring(el("#heroCanvas"), { hero:true, scene:1 });
  ringMain = ring(el("#ringCanvas"), { hero:false, scene:0 });
  hud();
  wire();
  observe();
}

if (document.readyState === "loading") addEventListener("DOMContentLoaded", boot);
else boot();

})();
</script>
