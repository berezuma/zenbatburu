const S = {
  lang: "eu",
  scene: 0,
  q: "",
  filt: "all",
  sort: { col: "t", dir: -1 },
};
let t = T.eu;

/* Zenbakiak eskuz formateatzen dira. `Intl`-ek ez du beti `eu-ES` ezagutzen,
   eta orduan ingelesezko komara jotzen du: «84,034». Euskaraz eta gaztelaniaz
   milakoen bereizlea puntua da, eta hamartarrena koma. */
function num(v){
  const neg = v < 0, s = String(Math.round(Math.abs(v)));
  let out = "";
  for (let i = 0; i < s.length; i++){
    if (i && (s.length - i) % 3 === 0) out += ".";
    out += s[i];
  }
  return (neg ? "\u2212" : "") + out;
}
function pct(v, d){
  const n = Math.abs(v).toFixed(d | 0).replace(".", ",");
  const s = (v < 0 ? "\u2212" : "") + n;
  return t.lang === "eu" ? "% " + s : s + " %";
}

const el = s => document.querySelector(s);
const els = s => Array.from(document.querySelectorAll(s));

/* Hilabeteen hasierako egunak eraztunerako goian daude (MSTART). */
const monthOf = d => { let m = 11; while (MSTART[m] > d) m--; return m; };

/* ===========================================================================
   1 · ERAZTUNA
   Animalia bakoitza marratxo erradial bat da. Eguna → angelua mapaketa bakarra
   da eszena guztietan, beraz marratxoak erradialki bakarrik mugitzen dira.
=========================================================================== */

/* Espezieen indize-zerrendak, behin bakarrik: fotograma bakoitzean espeziez
   taldekatuta marrazten da, trazu bat kolore bakoitzeko. */
const MSTART = [0,31,60,91,121,152,182,213,244,274,305,335,365];
const IS_FIRST = new Uint8Array(366);
for (let m = 0; m < 12; m++) IS_FIRST[MSTART[m]] = 1;

/* Bi zerrenda espezieko: hilaren lehen egunean erregistratutakoak eta
   gainerakoak. Hilaren 1a ez da jaiotza-eguna askotan, erregistroaren
   biribiltzea baizik, eta eszena batek hori erakusten du. */
const BY_SP = (() => {
  const a = SP_KEY.map(() => []), b = SP_KEY.map(() => []);
  for (let i = 0; i < N; i++) (IS_FIRST[DAY(i)] ? a : b)[SPI(i)].push(i);
  return SP_KEY.map((_, s) => ({ one: Int32Array.from(a[s]), rest: Int32Array.from(b[s]) }));
})();

/* Angelua eta bere sinua/kosinua egun bakoitzeko: 366 balio, behin. */
const COS = new Float32Array(366), SIN = new Float32Array(366);
for (let d = 0; d < 366; d++){
  const a = (d / 365) * Math.PI * 2 - Math.PI / 2;
  COS[d] = Math.cos(a); SIN[d] = Math.sin(a);
}

function drawBox(w, h, forHero){
  if (forHero){
    /* Partekatzeko txartelean testua ezkerrean doa eta eraztuna eskuinean.
       Pantaila estuan eraztuna beherago doa: bestela izenburuaren azpian
       geratzen da eta biak irakurgaitz bihurtzen dira. */
    const og = document.documentElement.classList.contains("og");
    const narrow = !og && w < 700;
    const m = og ? Math.min(w, h) * 0.98 : narrow ? w * 0.94 : Math.min(w, h) * 0.92;
    const cx = og ? w * 0.70 : w * 0.5;
    const cy = narrow ? h * 0.73 : h * 0.5;
    return { x: cx - m / 2, y: cy - m / 2, w: m, h: m };
  }
  /* Pantaila zabalean txartelak eskuinean daude, eta marrazkia ezkerrean.
     Estuan txartelak behean daude, eta marrazkiak goiko zatia hartzen du:
     eraztun bat ezin da txartel baten azpian geratu. */
  const wide = w >= 960, padT = wide ? 84 : 66;
  const bw = wide ? w * 0.53 : w;
  const bh = wide ? h - padT - 30 : h * 0.62 - padT;
  return { x: wide ? w * 0.025 : 6, y: padT, w: bw - 14, h: Math.max(140, bh) };
}

function wheels(scene, b){
  const out = [];
  if (scene <= 1){
    const m = Math.min(b.w, b.h);
    const g = { cx: b.x + b.w / 2, cy: b.y + b.h / 2, R: m * 0.27, room: m * 0.145 };
    for (let i = 0; i < NWHEEL; i++) out.push(g);
    return out;
  }
  if (scene === 4 || scene === 5){
    const focus = scene === 4 ? 1 : 3;
    const m = Math.min(b.w, b.h * 0.76);
    const cw = b.w / 4, sm = Math.min(cw, b.h * 0.2);
    let k = 0;
    for (let i = 0; i < NWHEEL; i++){
      if (i === focus) out.push({ cx: b.x + b.w / 2, cy: b.y + b.h * 0.40,
                                  R: m * 0.27, room: m * 0.145 });
      else { out.push({ cx: b.x + cw * (k + 0.5), cy: b.y + b.h * 0.89,
                        R: sm * 0.26, room: sm * 0.13 }); k++; }
    }
    return out;
  }
  /* Bost gurpil sareta batean. Zeldaren tamaina bi mugek erabakitzen dute,
     eta ilaren arteko tartea gurpilaren araberakoa da: bestela zutabeak
     zabalak direnean hutsune handi bat geratzen da erdian. */
  const cols = (b.w > b.h * 0.85 && b.w > 560) ? 3 : 2, rows = Math.ceil(NWHEEL / cols);
  const cw = b.w / cols, cell = Math.min(cw, b.h / rows);
  const stepY = Math.min(b.h / rows, cell * 1.1);
  const topY = b.y + (b.h - stepY * rows) / 2;
  for (let i = 0; i < NWHEEL; i++){
    const row = Math.floor(i / cols), inRow = i % cols;
    const inThis = Math.min(cols, NWHEEL - row * cols);
    const off = (b.w - inThis * cw) / 2;
    out.push({ cx: b.x + off + cw * (inRow + 0.5), cy: topY + stepY * (row + 0.5),
               R: cell * 0.25, room: cell * 0.132 });
  }
  return out;
}

/* Eszena bakoitzeko animalia bakoitzaren helmuga. Bi pasada: lehenengoan egun
   bakoitzean zenbat dauden, bigarrenean bakoitzari bere maila ematen. */
const bucket = new Int32Array(NWHEEL * 366 * 2);
const fillK  = new Int32Array(NWHEEL * 366 * 2);

function solve(scene, b, X, Y, LEN, LW, SPK){
  const wh = wheels(scene, b);
  const split = scene === 6;
  bucket.fill(0);
  for (let i = 0; i < N; i++){
    const w = WHEEL[SPI(i)];
    bucket[(w * 366 + DAY(i)) * 2 + (split ? SEX(i) : 0)]++;
  }
  /* Eskala ez da gehienekoarekin egiten, 98. pertzentilarekin baizik:
     hilaren lehen eguneko zutabeak zortzi aldiz luzeagoak dira, eta
     gehienekoak gainerako urtea ezabatuko luke. Zutabe horiek mugatuta
     marrazten dira, eta benetako kopurua puntan idazten da. */
  const unit = new Float64Array(NWHEEL), cap = new Float64Array(NWHEEL);
  const pool = [];
  for (let w = 0; w < NWHEEL; w++){
    pool.length = 0;
    for (let d = 0; d < 366; d++){
      const a = bucket[(w * 366 + d) * 2], c = bucket[(w * 366 + d) * 2 + 1];
      if (a) pool.push(a);
      if (c) pool.push(c);
    }
    pool.sort((x, y) => x - y);
    const p98 = pool.length ? pool[Math.min(pool.length - 1, Math.floor(pool.length * 0.98))] : 1;
    unit[w] = Math.min(3.2, Math.max(0.1, wh[w].room / Math.max(1, p98)));
    cap[w]  = wh[w].room * 1.35;
    LEN[w] = Math.max(0.55, unit[w] * 0.8);
    LW[w]  = Math.max(0.55, (2 * Math.PI * wh[w].R / 366) * 0.86);
  }
  for (let w = 0; w < NWHEEL; w++)
    for (let m = 0; m < 12; m++)
      SPK[w * 12 + m] = bucket[(w * 366 + MSTART[m]) * 2] + bucket[(w * 366 + MSTART[m]) * 2 + 1];
  fillK.fill(0);
  for (let i = 0; i < N; i++){
    const sp = SPI(i), w = WHEEL[sp], d = DAY(i);
    const side = split ? SEX(i) : 0;
    const idx = (w * 366 + d) * 2 + side;
    const k = fillK[idx]++;
    const g = wh[w];
    const out = Math.min(cap[w], k * unit[w]);
    const r = split && side === 1 ? g.R - Math.min(cap[w], (k + 1) * unit[w]) : g.R + out;
    X[i] = g.cx + COS[d] * r;
    Y[i] = g.cy + SIN[d] * r;
  }
  return wh;
}

/* Eszena bakoitzeko koloreak: espeziea, edo ilundua, edo tinta hutsa. */
function palette(scene){
  if (scene === 0) return SP_KEY.map(() => "rgba(29,26,20,.42)");
  if (scene === 4 || scene === 5){
    const focus = scene === 4 ? 1 : 3;
    return SP_KEY.map((_, s) => WHEEL[s] === focus ? COLOR[s] : INK_DIM);
  }
  return COLOR.slice();
}

function ring(canvas, opts){
  const o = Object.assign({ hero:false, scene:0 }, opts);
  const ctx = canvas.getContext("2d", { alpha:true });
  const X0 = new Float32Array(N), Y0 = new Float32Array(N);
  const X1 = new Float32Array(N), Y1 = new Float32Array(N);
  const Xd = new Float32Array(N), Yd = new Float32Array(N);
  const SPK = new Float64Array(NWHEEL * 12);
  const L0 = new Float64Array(NWHEEL), L1 = new Float64Array(NWHEEL);
  const W0 = new Float64Array(NWHEEL), W1 = new Float64Array(NWHEEL);
  let wh = null, w = 0, h = 0, dpr = 1, scene = o.scene, prev = o.scene;
  let t0 = 0, dur = 0, raf = 0, ready = false;
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

  function size(){
    const r = canvas.getBoundingClientRect();
    dpr = Math.min(2, window.devicePixelRatio || 1);
    w = Math.max(1, Math.round(r.width)); h = Math.max(1, Math.round(r.height));
    canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
  }

  function place(instant){
    const b = drawBox(w, h, o.hero);
    if (!ready || instant){
      wh = solve(scene, b, X1, Y1, L1, W1, SPK);
      X0.set(X1); Y0.set(Y1); L0.set(L1); W0.set(W1);
      Xd.set(X1); Yd.set(Y1);
      ready = true; dur = 0;
    } else {
      X0.set(Xd); Y0.set(Yd);
      for (let k = 0; k < NWHEEL; k++){ L0[k] = L1[k]; W0[k] = W1[k]; }
      wh = solve(scene, b, X1, Y1, L1, W1, SPK);
      t0 = performance.now(); dur = reduce ? 0 : 950;
    }
    tick();
  }

  const ease = p => p < .5 ? 4*p*p*p : 1 - Math.pow(-2*p + 2, 3) / 2;

  function paint(p){
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const colA = palette(prev), colB = palette(scene), e = ease(p);

    /* Pasada bat hilaren lehen egunekoentzat eta beste bat gainerakoentzat:
       3. eszenak lehenak bakarrik pizten ditu. */
    const tone = (sc, col, sp, first) =>
      sc === 3 ? (first ? COLOR[sp] : INK_DIM) : col[sp];

    for (let s = 0; s < SP_KEY.length; s++){
      const k = WHEEL[s];
      const len = L0[k] + (L1[k] - L0[k]) * e;
      for (let pass = 0; pass < 2; pass++){
        const ix = pass ? BY_SP[s].one : BY_SP[s].rest;
        if (!ix.length) continue;
        ctx.lineWidth = W0[k] + (W1[k] - W0[k]) * e;
        const cA = tone(prev, colA, s, pass), cB = tone(scene, colB, s, pass);
        ctx.strokeStyle = p >= 1 ? cB : (p < .45 ? cA : cB);
        ctx.globalAlpha = p >= 1 || p < .45 || p > .7 ? 1 : (p - .45) / .25;
        ctx.beginPath();
        for (let j = 0; j < ix.length; j++){
          const i = ix[j], d = DAY(i);
          const x = X0[i] + (X1[i] - X0[i]) * e, y = Y0[i] + (Y1[i] - Y0[i]) * e;
          Xd[i] = x; Yd[i] = y;
          const hx = COS[d] * len * .5, hy = SIN[d] * len * .5;
          ctx.moveTo(x - hx, y - hy); ctx.lineTo(x + hx, y + hy);
        }
        ctx.stroke();
      }
    }
    ctx.globalAlpha = 1;
    if (!o.hero) chrome(p >= 1 ? 1 : Math.max(0, (p - .55) / .45));
  }

  /* Gurpilen apaingarria: hilabeteen marrak, izenak eta espeziearen etiketa. */
  function chrome(a){
    if (a <= 0.01 || !wh) return;
    const big = scene <= 1 || scene === 4 || scene === 5;
    const seen = new Set();
    ctx.save();
    ctx.globalAlpha = a;
    for (let k = 0; k < NWHEEL; k++){
      const g = wh[k], tag = g.cx + "," + g.cy + "," + g.R;
      if (seen.has(tag)) continue;
      seen.add(tag);
      const focus = scene === 4 ? 1 : scene === 5 ? 3 : -1;
      const dim = focus >= 0 && k !== focus;
      ctx.strokeStyle = dim ? "rgba(29,26,20,.10)" : "rgba(29,26,20,.22)";
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(g.cx, g.cy, g.R, 0, Math.PI * 2); ctx.stroke();
      /* Gurpil txikietan hamabi hilabeteren izenak ez dira irakurtzen:
         lauzpabost bakarrik idazten dira, markak hor daude beti. */
      const every = (big && !dim) || g.R > 110 ? 1 : g.R > 46 ? 3 : 0;
      ctx.fillStyle = dim ? "rgba(29,26,20,.30)" : "rgba(135,128,106,1)";
      ctx.font = `${Math.max(8, Math.min(11, g.R * 0.09))}px "Spectral", Georgia, serif`;
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      for (let m = 0; m < 12; m++){
        const d = MSTART[m], r1 = g.R - 4, r2 = g.R + 4;
        ctx.beginPath();
        ctx.moveTo(g.cx + COS[d] * r1, g.cy + SIN[d] * r1);
        ctx.lineTo(g.cx + COS[d] * r2, g.cy + SIN[d] * r2);
        ctx.stroke();
        if (!every || (m % every)) continue;
        const mid = (MSTART[m] + MSTART[m + 1]) / 2, rl = g.R - 15;
        ctx.fillText(t.months[m], g.cx + COS[Math.round(mid)] * rl,
                                  g.cy + SIN[Math.round(mid)] * rl);
      }
      if (scene >= 2){
        /* 6. eszenan arrak barrurantz pilatzen dira eta erdia betetzen dute:
           izena gurpilaren azpira joaten da orduan. */
        ctx.fillStyle = dim ? "rgba(29,26,20,.34)" : COLOR[k];
        ctx.font = `${Math.max(11, Math.min(20, g.R * 0.17))}px "Instrument Serif", Georgia, serif`;
        ctx.fillText(t.sp[SP_KEY[k]], g.cx,
                     scene === 6 ? g.cy + g.R + g.room * 1.35 + 14 : g.cy);
      }
      if (scene === 3 && !dim){
        /* Hilaren lehen eguneko zutabeak moztuta daude: benetako kopurua
           puntan idazten da, ezer ezkutatu gabe. */
        ctx.fillStyle = COLOR[k];
        ctx.font = `${Math.max(9, Math.min(12, g.R * 0.1))}px "Spectral", Georgia, serif`;
        for (let m = 0; m < 12; m++){
          const v = SPK[k * 12 + m];
          if (v < 150 || g.R < 38) continue;
          /* Etiketak txandaka barruago eta kanporago, ondokoekin ez talka egiteko. */
          const d = MSTART[m], rr = g.R + g.room * 1.35 + (m % 2 ? 9 : 20);
          ctx.fillText(num(v), g.cx + COS[d] * rr, g.cy + SIN[d] * rr);
        }
      }
      if (scene === 6 && !dim && g.R > 46){
        ctx.fillStyle = "rgba(85,80,63,1)";
        ctx.font = `13px "Spectral", Georgia, serif`;
        ctx.fillText("♀", g.cx, g.cy - g.R - g.room * 1.35 - 11);
        ctx.fillText("♂", g.cx, g.cy - g.R + g.room * 0.7);
      }
    }
    ctx.restore();
  }

  function tick(){
    cancelAnimationFrame(raf);
    const step = () => {
      const p = dur ? Math.min(1, (performance.now() - t0) / dur) : 1;
      paint(p);
      if (p < 1) raf = requestAnimationFrame(step);
      else prev = scene;
    };
    raf = requestAnimationFrame(step);
  }

  const api = {
    to(next){
      if (next === scene) return;
      prev = scene; scene = next; place(false);
      if (!o.hero) hud();
    },
    resize(){ size(); place(true); },
    repaint(){ paint(1); },
    get scene(){ return scene; }
  };
  size(); place(true);
  return api;
}

/* HUD: animalia-kopurua eta gailurra, eszenaren arabera */
function hud(){
  const sc = S.scene;
  const focus = sc === 4 ? "ardi" : sc === 5 ? "zaldi" : null;
  const row = focus ? RAW.sp.find(x => x.k === focus) : null;
  el("#hudN").textContent = num(sc === 3 ? RAW.round.one : row ? row.t : N);
  let best = 0, bi = 0;
  const m = row ? row.m : RAW.sp.reduce((a, x) => a.map((v, i) => v + x.m[i]), new Array(12).fill(0));
  m.forEach((v, i) => { if (v > best){ best = v; bi = i; } });
  el("#hudPeak").textContent = t.monthsLong[bi].replace(/^./, c => c.toUpperCase());
  const lab = el("#ringCanvas");
  if (lab) lab.setAttribute("aria-label", t.steps[sc].h + ". " + t.steps[sc].p);
}

function catalogue(){
  /* Ordena: arrisku-maila ofiziala lehenik, eta maila bakoitzaren barruan
     jaiotza gehien dituztenak lehenengo. Hala irakurleak katalogoaren logika
     ikusten du, eta ondoan datuek dioten beste gauza. */
  const rank = o => o === "Crítica" ? 0 : o === "En peligro" ? 1 : 2;
  const rows = RAW.official.slice().sort((a, b) => rank(a.o) - rank(b.o) || b.t - a.t);

      <div class="cat-name">${esc(t.cols.name)}</div>
      <div class="cat-state">${esc(t.catCols.state)}</div>

    </div>`;
  el("#cat").innerHTML = head + rows.map(o => {
    const mx = Math.max(1, ...o.y);
    const col = COLOR[SP_KEY.indexOf(o.sp)] || INK;
    const bars = o.y.map((v, i) => `<span title="${RAW.years[i]}: ${num(v)}" style="height:${
      o.t ? Math.max(3, (v / mx) * 100) : 3}%;background:${o.t ? col : "var(--ink-20)"}"></span>`).join("");
    const d = o.y[0] ? ((o.y[2] - o.y[0]) / o.y[0]) * 100 : 0;
    const delta = o.t
      ? `<small>${d >= 0 ? "↑" : "↓"} ${pct(Math.abs(d), 0)}</small>`
      : `<small>—</small>`;
    return `<div class="cat-row${o.t ? "" : " cat-zero"}">
      <div class="cat-name">${esc(FAM(o.n))}<i>${esc(SP_OF(o.sp))}</i></div>
      <div class="cat-state" data-s="${stateKey(o.o)}">${esc(t.states[o.o] || o.o)}</div>
      <div class="cat-bars">${bars}</div>
      <div class="cat-n">${num(o.t)}${delta}</div>
    </div>`;
  }).join("");
}

/* ----------------------------------------------------------- arrazen taula */
const COLDEF = [
  { k:"name", f:r => r.n,    kind:"txt" },
  { k:"sp",   f:r => r.sp,   kind:"txt" },
  { k:"off",  f:r => r.o ? (r.o === "Crítica" ? 3 : r.o === "En peligro" ? 2 : 1) : 0, kind:"n" },
  { k:"t",    f:r => r.t,    kind:"n" },
  { k:"y23",  f:r => r.y[0], kind:"n" },
  { k:"y24",  f:r => r.y[1], kind:"n" },
  { k:"y25",  f:r => r.y[2], kind:"n" },
  { k:"fem",  f:r => r.t ? r.f / r.t : 0, kind:"n" },
  { k:"var",  f:r => r.v.length, kind:"n" },
];

function rowsNow(){
  const q = S.q.trim().toLowerCase();
  return RAW.fam.filter(r => {
    if (S.filt === "kat" && !r.o) return false;
    if (S.filt !== "all" && S.filt !== "kat" && r.sp !== S.filt) return false;
    if (!q) return true;
    if (FAM(r.n).toLowerCase().includes(q) || r.n.toLowerCase().includes(q)) return true;
    return r.v.some(v => String(v[0]).toLowerCase().includes(q));
  }).sort((a, b) => {
    const c = COLDEF.find(x => x.k === S.sort.col) || COLDEF[3];
    const av = c.f(a), bv = c.f(b);
    if (c.kind === "txt") return String(av).localeCompare(String(bv), t.loc) * S.sort.dir * -1;
    return (av - bv) * S.sort.dir;
  });
}

function table(){
  const rows = rowsNow(), mx = Math.max(1, ...RAW.fam.map(r => r.t));
  const head = COLDEF.map(c => {
    const on = S.sort.col === c.k;
    const cls = c.kind === "n" && c.k !== "off" ? ' class="num"' : "";
    return `<th${cls}${on ? ` aria-sort="${S.sort.dir < 0 ? "descending" : "ascending"}"` : ""}>
      <button type="button" data-col="${c.k}">${esc(t.cols[c.k])}${on ? (S.sort.dir < 0 ? " ↓" : " ↑") : ""}</button></th>`;
  }).join("");
  el("#brTable").querySelector("thead").innerHTML = `<tr>${head}</tr>`;
  const body = rows.map(r => {
    const col = COLOR[SP_KEY.indexOf(r.sp)] || INK;
    const tag = r.o ? `<span class="tag" data-s="${stateKey(r.o)}">${esc(t.states[r.o] || r.o)}</span>` : "";
    return `<tr>
      <td><span class="dot" style="background:${col}"></span>${esc(FAM(r.n))}
        ${r.v.length ? `<i style="color:var(--ink-45);font-style:normal;font-size:.8em"> · ${esc(r.v.map(v => v[0]).join(", "))}</i>` : ""}</td>
      <td>${esc(SP_OF(r.sp))}</td>
      <td>${tag}</td>
      <td class="num">${num(r.t)}<span class="bar" style="width:${(r.t / mx) * 100}%;background:${col};opacity:.5"></span></td>
      <td class="num">${num(r.y[0])}</td>
      <td class="num">${num(r.y[1])}</td>
      <td class="num">${num(r.y[2])}</td>
      <td class="num">${r.t ? pct((r.f / r.t) * 100, 1) : "—"}</td>
      <td class="num">${r.v.length || "—"}</td>
    </tr>`;
  }).join("");
  el("#brTable").querySelector("tbody").innerHTML =
    body || `<tr><td colspan="9" style="color:var(--ink-45)">${esc(t.none)}</td></tr>`;
  el("#qcount").textContent = rows.length === RAW.fam.length
    ? t.count(num(rows.length)) : t.countOf(num(rows.length), num(RAW.fam.length));
}

function csv(){
  const head = ["arraza","espeziea","81/2015","guztira","2023","2024","2025","emeak","aldaerak"];
  const q = s => `"${String(s).replace(/"/g, '""')}"`;
  const lines = [head.join(",")].concat(rowsNow().map(r => [
    q(FAM(r.n)), q(SP_OF(r.sp)), q(r.o || ""), r.t, r.y[0], r.y[1], r.y[2],
    r.t ? (r.f / r.t).toFixed(4) : "", r.v.length
  ].join(",")));
  const blob = new Blob(["﻿" + lines.join("\n")], { type:"text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = t.csvFile;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

/* ---------------------------------------------------- hilabeteen grafikoa */
function calendar(){
  const svg = el("#cal"), sp = RAW.sp.filter(x => x.t > 50);
  const cols = 3, rows = Math.ceil(sp.length / cols);
  const W = 1000, PAD = 14, cw = (W - PAD * 2) / cols, chh = 154;
  const H = PAD * 2 + rows * chh;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  let out = "";
  sp.forEach((s, i) => {
    const cx = PAD + (i % cols) * cw, cy = PAD + Math.floor(i / cols) * chh;
    const iw = cw - 26, ih = chh - 54, mx = Math.max(...s.m);
    const col = COLOR[SP_KEY.indexOf(s.k)] || INK;
    const px = m => cx + 8 + (iw / 11) * m;
    const py = v => cy + 34 + ih - (v / mx) * ih;
    const pts = s.m.map((v, m) => `${px(m).toFixed(1)},${py(v).toFixed(1)}`).join(" ");
    out += `<g>
      <text x="${cx + 8}" y="${cy + 14}" font-family="Instrument Serif, Georgia, serif"
        font-size="18" fill="${col}">${esc(t.sp[s.k])}</text>
      <text x="${cx + 8}" y="${cy + 28}" font-size="10.5" fill="#87806a"
        >${num(s.t)} · ${pct((s.f / s.t) * 100, 1)} ${esc(t.female)}</text>
      <line x1="${cx + 8}" y1="${cy + 34 + ih}" x2="${cx + 8 + iw}" y2="${cy + 34 + ih}"
        stroke="#cfc7b4" stroke-width="1"/>
      <polygon points="${cx + 8},${cy + 34 + ih} ${pts} ${cx + 8 + iw},${cy + 34 + ih}"
        fill="${col}" fill-opacity=".16"/>
      <polyline points="${pts}" fill="none" stroke="${col}" stroke-width="1.6"
        stroke-linejoin="round"/>`;
    s.m.forEach((v, m) => {
      out += `<circle class="cdot" data-sp="${s.k}" data-m="${m}" cx="${px(m).toFixed(1)}"
        cy="${py(v).toFixed(1)}" r="7" fill="transparent"/>`;
    });
    [0, 3, 6, 9].forEach(m => {
      out += `<text x="${px(m).toFixed(1)}" y="${cy + 34 + ih + 14}" font-size="9.5"
        text-anchor="middle" fill="#87806a">${esc(t.months[m])}</text>`;
    });
    out += `</g>`;
  });
  svg.innerHTML = out;
  svg.setAttribute("aria-label", t.calTitle + ". " + sp.map(s =>
    `${t.sp[s.k]}: ${num(s.t)}`).join("; "));

  const tip = el("#tipC"), box = el("#calbox");
  const show = (c) => {
    const s = RAW.sp.find(x => x.k === c.dataset.sp), m = +c.dataset.m;
    const r = box.getBoundingClientRect(), p = c.getBoundingClientRect();
    tip.innerHTML = `<b>${esc(t.sp[s.k])}</b> · ${esc(t.monthsLong[m])}<br>${num(s.m[m])} ${esc(t.animals)}`;
    tip.classList.add("on");
    tip.style.left = Math.max(4, Math.min(r.width - tip.offsetWidth - 4,
      p.left - r.left + p.width / 2 - tip.offsetWidth / 2)) + "px";
    tip.style.top = (p.top - r.top - tip.offsetHeight - 6) + "px";
  };
  svg.querySelectorAll(".cdot").forEach(c => {
    c.addEventListener("mouseenter", () => show(c));
    c.addEventListener("mouseleave", () => tip.classList.remove("on"));
  });
  let ci = -1;
  box.onkeydown = e => {
    const all = Array.from(svg.querySelectorAll(".cdot"));
    if (e.key === "ArrowRight" || e.key === "ArrowLeft"){
      ci = (ci + (e.key === "ArrowRight" ? 1 : -1) + all.length) % all.length;
      show(all[ci]); e.preventDefault();
    } else if (e.key === "Escape") tip.classList.remove("on");
  };
  box.onblur = () => tip.classList.remove("on");
}

function flow(){

  const tmx = Math.max(...named.map(x => x[2]));
  const medmx = Math.max(...named.map(x => x[4]));
  const catRows = [[t.flowIn, M.cat.barrukoa], [t.flowOut, M.cat.irteera], [t.flowBack, M.cat.sarrera]];
  const cmx = Math.max(...catRows.map(c => c[1]));

      <h3>${esc(t.flow[k].h)}</h3><p>${esc(t.flow[k].p)}</p>

    card("a", dest.map(d => `<div><b>${esc(REG(d[0]))}</b>${bar(d[2], dmx)}<span>${num(d[2])}</span></div>`).join("")) +

  el("#calLegend").textContent = t.calLegend;
  document.title = t.title + " · " + (t.lang === "eu"
    ? "Bizkaian jaiotzen diren abereak, banan-banan"
    : "Las cabezas de ganado que nacen en Bizkaia, una a una");
}

function renderAll(){
  i18n(); steps(); catalogue(); table(); calendar(); flow(); prose(); hud();
  observe();
  if (ringMain) ringMain.repaint();
  if (heroRing) heroRing.repaint();
}

function setLang(l, push){
  if (!T[l] || l === S.lang) return;
  S.lang = l; t = T[l];
  try { localStorage.setItem("zenbat-buru-lang", l); } catch (e) {}
  renderAll();
  if (push !== false) hash();
}

function hash(){
  const p = new URLSearchParams();
  if (S.lang !== "eu") p.set("lang", S.lang);
  if (S.filt !== "all") p.set("f", S.filt);
  if (S.q) p.set("q", S.q);
  const s = p.toString();
  history.replaceState(null, "", s ? "#" + s : location.pathname + location.search);
}

function fromHash(){
  const p = new URLSearchParams(location.hash.replace(/^#/, ""));
  let l = p.get("lang");
  if (!l){ try { l = localStorage.getItem("zenbat-buru-lang"); } catch (e) {} }
  if (!l){ l = (navigator.language || "eu").toLowerCase().startsWith("es") ? "es" : "eu"; }
  if (T[l]) { S.lang = l; t = T[l]; }
  const f = p.get("f");
  if (f && (f === "kat" || f === "all" || SP_KEY.includes(f))) S.filt = f;
  const q = p.get("q");
  if (q) S.q = q;
}

/* --------------------------------------------------------------- behatzailea */
let io = null;
function observe(){
  if (io) io.disconnect();
  io = new IntersectionObserver(ent => {
    ent.forEach(e => {
      if (!e.isIntersecting) return;
      const i = +e.target.dataset.i;
      if (i === S.scene) return;
      S.scene = i;
      if (ringMain) ringMain.to(i);
      hud();
    });
  }, { rootMargin: "-45% 0px -45% 0px", threshold: 0 });
  els(".step").forEach(s => io.observe(s));
}

/* ------------------------------------------------------------------ gertaerak */
function wire(){
  els("[data-lang]").forEach(b => b.addEventListener("click", () => setLang(b.dataset.lang)));

  els("[data-filt]").forEach(b => b.addEventListener("click", () => {
    S.filt = b.dataset.filt;
    els("[data-filt]").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
    table(); hash();
  }));

  const q = el("#q");
  q.value = S.q;
  let qt = 0;
  q.addEventListener("input", () => {
    S.q = q.value;
    clearTimeout(qt); qt = setTimeout(() => { table(); hash(); }, 110);
  });
  el("#qclear").addEventListener("click", () => { q.value = ""; S.q = ""; table(); hash(); q.focus(); });

  el("#brTable").addEventListener("click", e => {
    const b = e.target.closest("button[data-col]");
    if (!b) return;
    const c = b.dataset.col;
    if (S.sort.col === c) S.sort.dir *= -1;
    else S.sort = { col: c, dir: c === "name" || c === "sp" ? 1 : -1 };
    table();
  });

  el("#csv").addEventListener("click", csv);

  el("#share").addEventListener("click", async () => {
    const url = location.href;
    try {
      if (navigator.share) await navigator.share({ title: t.title, url });
      else { await navigator.clipboard.writeText(url);
        const s = el("#share").querySelector("span"), old = s.textContent;
        s.textContent = t.shared; setTimeout(() => { s.textContent = old; }, 1600); }
    } catch (e) {}
  });

  let rt = 0;
  const onResize = () => {
    clearTimeout(rt);
    rt = setTimeout(() => {
      if (ringMain) ringMain.resize();
      if (heroRing) heroRing.resize();
      calendar();
    }, 140);
  };
  addEventListener("resize", onResize);
  addEventListener("orientationchange", onResize);
  if (window.ResizeObserver){
    const ro = new ResizeObserver(onResize);
    ro.observe(el("#ringCanvas")); ro.observe(el("#heroCanvas"));
  }
}

/* ---------------------------------------------------------------- abiatzea */
function boot(){
  fromHash();
  renderAll();
  els("[data-filt]").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.filt === S.filt)));
  heroRing = ring(el("#heroCanvas"), { hero:true, scene:1 });
  ringMain = ring(el("#ringCanvas"), { hero:false, scene:0 });
  hud();
  wire();
  observe();
}

if (document.readyState === "loading") addEventListener("DOMContentLoaded", boot);
else boot();

})();
</script>
